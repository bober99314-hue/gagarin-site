<style>
/* ==========================================================================
   Sonara — design tokens
   ========================================================================== */
:root {
  --bg: #101014;
  --bg-2: #18181f;
  --card: #22222b;
  --card-hover: #2b2b37;
  --line: rgba(255, 255, 255, .08);
  --line-strong: rgba(255, 255, 255, .16);
  --text: #ffffff;
  --text-2: #a5a5b8;
  --text-3: #73738a;
  --accent: #8b5cf6;
  --accent-2: #2dd4bf;
  --accent-soft: rgba(139, 92, 246, .18);
  --on-accent: #ffffff;
  --danger: #f87171;
  --ok: #34d399;
  --grad: linear-gradient(135deg, #8b5cf6 0%, #6d7cf5 45%, #2dd4bf 100%);
  --shadow: 0 20px 60px rgba(0, 0, 0, .5);
  --shadow-sm: 0 8px 24px rgba(0, 0, 0, .35);
  --hero-l: 30%;
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar-w: 264px;
  --player-h: 88px;
  --topbar-h: 68px;
  --mobile-nav-h: 0px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f4f4f9;
  --bg-2: #ffffff;
  --card: #ffffff;
  --card-hover: #f1eefd;
  --line: rgba(16, 16, 20, .09);
  --line-strong: rgba(16, 16, 20, .2);
  --text: #15151c;
  --text-2: #5a5a6e;
  --text-3: #8b8ba0;
  --accent: #7c3aed;
  --accent-2: #0d9488;
  --accent-soft: rgba(124, 58, 237, .12);
  --shadow: 0 20px 60px rgba(30, 20, 70, .18);
  --shadow-sm: 0 8px 24px rgba(30, 20, 70, .12);
  --hero-l: 78%;
  color-scheme: light;
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Inter", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background-color .3s, color .3s;
}
h1, h2, h3, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent); color: #fff; }
svg.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.icon.solid { fill: currentColor; stroke: none; }
.skip-link { position: fixed; left: 12px; top: -60px; z-index: 200; padding: 10px 16px; border-radius: 10px; background: var(--accent); color: #fff; transition: top .2s; }
.skip-link:focus { top: 12px; }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }

/* ==========================================================================
   App shell
   ========================================================================== */
#app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto auto;
  height: 100vh;
  height: 100dvh;
}
#sidebar {
  grid-row: 1; grid-column: 1;
  display: flex; flex-direction: column; gap: 6px;
  padding: 20px 14px 14px;
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  min-height: 0;
  z-index: 60;
}
#main { grid-row: 1; grid-column: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
#player { grid-row: 2; grid-column: 1 / -1; }
#mobile-nav { grid-row: 3; grid-column: 1 / -1; display: none; }

/* Sidebar */
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 10px 18px; font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.brand-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--grad); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(139, 92, 246, .45); }
.brand-mark svg { width: 20px; height: 20px; fill: #fff; }
.nav-list { display: flex; flex-direction: column; gap: 2px; }
.nav-link {
  display: flex; align-items: center; gap: 13px;
  padding: 10px 12px; border-radius: 12px;
  color: var(--text-2); font-weight: 600; font-size: 14.5px;
  position: relative;
  transition: background-color .2s, color .2s, transform .2s var(--ease);
}
.nav-link:hover { color: var(--text); background: var(--line); }
.nav-link:active { transform: scale(.98); }
.nav-link.active { color: var(--text); background: var(--accent-soft); }
.nav-link.active svg { color: var(--accent); }
.nav-link.active::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--grad); }
.nav-count { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--text-3); background: var(--line); border-radius: 20px; padding: 1px 8px; }
.side-section { display: flex; flex-direction: column; min-height: 0; flex: 1; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 6px 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }
.side-playlists { overflow-y: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.side-pl { display: flex; align-items: center; gap: 11px; padding: 6px 8px; border-radius: 10px; color: var(--text-2); transition: background-color .2s, color .2s; }
.side-pl:hover, .side-pl.active { background: var(--line); color: var(--text); }
.side-pl img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex: none; }
.side-pl-name { font-weight: 600; font-size: 14px; }
.side-pl-meta { font-size: 12px; color: var(--text-3); }
.side-empty { padding: 8px 12px; font-size: 13px; color: var(--text-3); }
.side-foot { padding-top: 8px; border-top: 1px solid var(--line); }
.side-foot button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 10px; color: var(--text-3); font-size: 13px; font-weight: 600; text-align: left; transition: color .2s, background-color .2s; }
.side-foot button:hover { color: var(--text); background: var(--line); }
.side-foot svg.icon { width: 17px; height: 17px; }
#scrim { display: none; }

/* Top bar */
#topbar {
  height: var(--topbar-h); flex: none;
  display: flex; align-items: center; gap: 10px;
  padding: 0 28px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid transparent;
  position: relative; z-index: 20;
  transition: border-color .2s;
}
#topbar.scrolled { border-bottom-color: var(--line); }
.icon-btn {
  width: 38px; height: 38px; flex: none;
  display: inline-grid; place-items: center;
  border-radius: 50%; color: var(--text-2);
  transition: color .2s, background-color .2s, transform .15s var(--ease);
}
.icon-btn:hover { color: var(--text); background: var(--line); }
.icon-btn:active { transform: scale(.9); }
.icon-btn.sm { width: 32px; height: 32px; }
.icon-btn.sm svg.icon { width: 17px; height: 17px; }
.icon-btn.solid-bg { background: var(--card); border: 1px solid var(--line); }
.search-box { position: relative; flex: 1; max-width: 460px; margin-left: 4px; }
.search-box > svg.icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-3); pointer-events: none; }
#search-input {
  width: 100%; height: 44px; padding: 0 44px 0 44px;
  border-radius: 24px; border: 1px solid var(--line);
  background: var(--card); outline: none;
  transition: border-color .2s, box-shadow .2s, background-color .2s;
}
#search-input::placeholder { color: var(--text-3); }
#search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
#search-input::-webkit-search-cancel-button { display: none; }
#search-clear { position: absolute; right: 6px; top: 6px; }
.topbar-spacer { flex: 1; }
.profile-chip { display: flex; align-items: center; gap: 9px; padding: 4px 14px 4px 4px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); font-weight: 600; font-size: 14px; max-width: 190px; transition: border-color .2s, transform .15s var(--ease); }
.profile-chip:hover { border-color: var(--line-strong); }
.profile-chip:active { transform: scale(.97); }
.profile-chip img { width: 32px; height: 32px; border-radius: 50%; flex: none; }
#btn-menu { display: none; }

/* View container */
#view { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 28px 56px; outline: none; }
.page { max-width: 1500px; margin: 0 auto; animation: page-in .35s var(--ease) both; }
#view.no-anim .page, #view.no-anim .card, #view.no-anim .row, #view.no-anim .tile, #view.no-anim .mood { animation: none; }
@keyframes page-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop-in { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }

/* ==========================================================================
   Buttons, chips, generic
   ========================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 22px; border-radius: 24px;
  font-weight: 700; font-size: 14.5px; white-space: nowrap;
  background: var(--card); border: 1px solid var(--line); color: var(--text);
  transition: transform .15s var(--ease), background-color .2s, border-color .2s, box-shadow .2s, filter .2s;
}
.btn:hover { background: var(--card-hover); border-color: var(--line-strong); }
.btn:active { transform: scale(.96); }
.btn svg.icon { width: 18px; height: 18px; }
.btn.primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 8px 24px rgba(139, 92, 246, .35); }
.btn.primary:hover { filter: brightness(1.1); box-shadow: 0 10px 30px rgba(139, 92, 246, .5); }
.btn.danger { color: var(--danger); }
.btn.danger.fill { background: var(--danger); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { height: 34px; padding: 0 14px; font-size: 13px; }
.btn.sm svg.icon { width: 15px; height: 15px; }
.btn.icon-only { width: 44px; padding: 0; }
.btn .when-playing, body.is-playing .is-current-source.btn .when-paused { display: none; }
body.is-playing .is-current-source.btn .when-playing { display: inline-flex; align-items: center; gap: 8px; }
.btn .when-paused { display: inline-flex; align-items: center; gap: 8px; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); }
.muted { color: var(--text-2); }
.dot-sep > * + *::before { content: "•"; margin: 0 8px; color: var(--text-3); }

/* ==========================================================================
   Sections, rails, cards
   ========================================================================== */
.section { margin-top: 38px; }
.section-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.section-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.section-head .section-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.section-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.link-more { font-size: 13px; font-weight: 700; color: var(--text-2); padding: 6px 10px; border-radius: 16px; transition: color .2s, background-color .2s; }
.link-more:hover { color: var(--text); background: var(--line); }
.rail {
  display: grid; grid-auto-flow: column; grid-auto-columns: clamp(148px, 15.5vw, 196px);
  gap: 18px; overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x proximity; scroll-behavior: smooth;
  padding: 6px 4px 14px; margin: -6px -4px 0;
  scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 20px; }

.card {
  position: relative; padding: 14px; border-radius: var(--radius);
  background: var(--card); border: 1px solid var(--line);
  transition: transform .3s var(--ease), background-color .25s, box-shadow .3s, border-color .25s;
  animation: card-in .45s var(--ease) both; animation-delay: calc(min(var(--i, 0), 12) * 35ms);
  min-width: 0;
}
.card:hover { transform: translateY(-5px); background: var(--card-hover); box-shadow: var(--shadow-sm); border-color: var(--line-strong); }
.card-art { position: relative; aspect-ratio: 1; }
.card-img { width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background: var(--bg-2); box-shadow: 0 8px 20px rgba(0, 0, 0, .28); }
.card-art img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.card:hover .card-art img { transform: scale(1.05); }
.card.round .card-img { border-radius: 50%; }
.card.round { text-align: center; }
.card-title { display: block; width: 100%; margin-top: 13px; font-weight: 700; font-size: 14.5px; text-align: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-title::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }
.card-sub { position: relative; z-index: 2; display: block; margin-top: 2px; font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
a.card-sub:hover { color: var(--text); text-decoration: underline; }
.fab {
  position: absolute; right: 10px; bottom: 10px; z-index: 3;
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--grad); color: #fff;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .4);
  opacity: 0; transform: translateY(10px) scale(.9);
  transition: opacity .25s, transform .25s var(--ease), filter .2s;
}
.fab svg.icon { width: 20px; height: 20px; }
.fab:hover { filter: brightness(1.12); transform: scale(1.07) !important; }
.card:hover .fab, .card:focus-within .fab, .card.is-current .fab, .card.is-current-source .fab { opacity: 1; transform: none; }
.fab .i-pause, body.is-playing .is-current .fab .i-play, body.is-playing .is-current-source .fab .i-play { display: none; }
body.is-playing .is-current .fab .i-pause, body.is-playing .is-current-source .fab .i-pause { display: block; }
.card.is-current .card-title, .card.is-current-source .card-title { color: var(--accent); }
.card-badge { position: absolute; left: 8px; top: 8px; z-index: 2; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; background: rgba(10, 10, 14, .62); backdrop-filter: blur(6px); }
.card-eq { position: absolute; left: 10px; bottom: 12px; z-index: 2; padding: 6px 7px; border-radius: 8px; background: rgba(10, 10, 14, .62); display: none; }
.card.is-current .card-eq { display: block; }
.card.is-current .card-badge { display: none; }
.card.create { display: grid; place-items: center; text-align: center; border-style: dashed; border-color: var(--line-strong); background: transparent; color: var(--text-2); min-height: 200px; width: 100%; gap: 0; font-weight: 700; }
.card.create:hover { color: var(--text); background: var(--accent-soft); border-color: var(--accent); }
.card.create .plus { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin: 0 auto 12px; }

.eq { display: inline-flex; align-items: flex-end; gap: 2px; width: 14px; height: 14px; }
.eq i { width: 3px; height: 30%; border-radius: 2px; background: var(--accent-2); animation: eq .9s ease-in-out infinite; animation-play-state: paused; }
.eq i:nth-child(2) { animation-duration: .7s; animation-delay: -.3s; }
.eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -.6s; }
body.is-playing .eq i { animation-play-state: running; }

/* Home hero + quick tiles */
.greeting { position: relative; margin-top: 6px; padding: 30px 30px 28px; border-radius: 24px; overflow: hidden; background: linear-gradient(135deg, hsl(262 70% var(--hero-l)) 0%, hsl(215 60% var(--hero-l)) 55%, hsl(172 60% var(--hero-l)) 100%); }
.greeting::after { content: ""; position: absolute; inset: 0; background: radial-gradient(600px 240px at 85% -10%, rgba(255, 255, 255, .22), transparent 70%); pointer-events: none; }
.greeting h1 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.greeting p { margin-top: 8px; color: color-mix(in srgb, var(--text) 78%, transparent); max-width: 60ch; }
.tiles { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 22px; }
.tile { position: relative; display: flex; align-items: center; gap: 12px; min-width: 0; height: 64px; padding-right: 10px; border-radius: 12px; overflow: hidden; background: color-mix(in srgb, var(--bg) 46%, transparent); backdrop-filter: blur(10px); font-weight: 700; font-size: 14px; transition: background-color .2s, transform .2s var(--ease); animation: card-in .4s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
.tile:hover { background: color-mix(in srgb, var(--bg) 66%, transparent); transform: translateY(-2px); }
.tile img { width: 64px; height: 64px; object-fit: cover; flex: none; }
.tile-link { flex: 1; min-width: 0; }
.tile-link::after { content: ""; position: absolute; inset: 0; }
.tile .fab { position: relative; right: auto; bottom: auto; width: 38px; height: 38px; flex: none; }
.tile:hover .fab, .tile:focus-within .fab, .tile.is-current-source .fab { opacity: 1; transform: none; }
.tile .fab svg.icon { width: 16px; height: 16px; }

/* Mood tiles */
.moods { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.mood { position: relative; display: block; height: 116px; padding: 16px; border-radius: var(--radius); overflow: hidden; color: #fff; font-weight: 800; font-size: 19px; letter-spacing: -.01em; background: linear-gradient(135deg, hsl(var(--hue) 72% 52%), hsl(calc(var(--hue) + 45) 70% 32%)); transition: transform .3s var(--ease), box-shadow .3s; animation: card-in .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 35ms); }
.mood:hover { transform: translateY(-4px) scale(1.015); box-shadow: var(--shadow-sm); }
.mood small { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 600; opacity: .85; }
.mood img { position: absolute; right: -14px; bottom: -14px; width: 86px; height: 86px; border-radius: 10px; transform: rotate(18deg); box-shadow: 0 8px 20px rgba(0, 0, 0, .35); transition: transform .4s var(--ease); }
.mood:hover img { transform: rotate(10deg) scale(1.06); }

/* ==========================================================================
   Track list
   ========================================================================== */
.tracklist { display: flex; flex-direction: column; }
.row {
  display: grid; align-items: center; gap: 14px;
  grid-template-columns: 34px 44px minmax(0, 5fr) minmax(0, 3fr) 34px 46px 34px;
  padding: 7px 10px; border-radius: 12px; cursor: pointer;
  transition: background-color .15s;
  animation: fade-in .35s both; animation-delay: calc(min(var(--i, 0), 16) * 18ms);
}
.row.no-album { grid-template-columns: 34px 44px minmax(0, 1fr) 34px 46px 34px; }
.row.removable { grid-template-columns: 34px 44px minmax(0, 5fr) minmax(0, 3fr) 34px 46px 34px 34px; }
.row.compact { grid-template-columns: 44px minmax(0, 1fr) auto; }
.row:hover, .row:focus-within { background: var(--line); }
.row.is-current { background: var(--accent-soft); }
.row-idx { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--text-3); font-size: 14px; font-variant-numeric: tabular-nums; }

/* ==========================================================================
   5. PERSISTENT STATE (localStorage, with an in-memory fallback)
   ========================================================================== */
const STORE_PREFIX = 'sonara:';
const store = {
  memory: {},
  warned: false,
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(STORE_PREFIX + key);
      return raw == null ? (key in this.memory ? this.memory[key] : fallback) : JSON.parse(raw);
    } catch (err) {
      return key in this.memory ? this.memory[key] : fallback;
    }
  },
  set(key, value) {
    this.memory[key] = value;
    try {
      localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value));
    } catch (err) {
      if (!this.warned) {
        this.warned = true;
        toast('Your browser would not save this change, so it may be lost when you close the page.', 'error');
      }
    }
  },
  clear() {
    this.memory = {};
    try {
      Object.keys(localStorage).filter((k) => k.startsWith(STORE_PREFIX)).forEach((k) => localStorage.removeItem(k));
    } catch (err) { /* storage unavailable: nothing to clear */ }
  },
};

const COVER_PRESETS = ['aurora', 'sunset drive', 'deep sea', 'citrus', 'midnight', 'orchid', 'forest', 'ember'];
const AVATAR_HUES = [262, 196, 168, 128, 44, 22, 348, 310];

function cleanPlaylists(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter((p) => p && typeof p.id === 'string' && typeof p.name === 'string').map((p) => ({
    id: p.id,
    name: p.name.slice(0, 80) || 'Untitled playlist',

    cover: p.cover && (p.cover.type === 'image' ? typeof p.cover.data === 'string' : p.cover.type === 'preset') ? p.cover : { type: 'preset', seed: COVER_PRESETS[0] },
    trackIds: Array.isArray(p.trackIds) ? [...new Set(p.trackIds.filter((id) => trackById.has(id)))] : [],
    createdAt: Number(p.createdAt) || Date.now(),
  }));
}
function cleanHistory(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter((h) => h && trackById.has(h.id) && Number(h.at) > 0).slice(0, 200);
}

function playlistCover(pl) {
  if (pl.cover && pl.cover.type === 'image' && pl.cover.data) return pl.cover.data;
  return coverArt('playlist-' + ((pl.cover && pl.cover.seed) || COVER_PRESETS[0]));
}

/* Most recent first, one entry per track. */
function recentEntries(limit = 50) {
  const seen = new Set(), out = [];
  for (const h of state.history) {
    if (seen.has(h.id)) continue;
    seen.add(h.id);
    out.push({ track: trackById.get(h.id), at: h.at });
    if (out.length >= limit) break;
  }
  return out;
}
const recentTracks = (limit) => recentEntries(limit).map((e) => e.track);

function viewSearch() {
  const raw = ui.query.trim();
  const q = norm(raw);
  if (!q) {
    const html = pageHead('Search', 'Find tracks, artists, albums and playlists — results appear as you type.')
      + section('Browse by mood', `<div class="moods">${activeMoods.map(moodTile).join('')}</div>`)

      + cardRail('Browse artists', allArtists.map(artistCard), { tools: moreLink('#/artists') });
    return { html, title: 'Search', nav: 'search' };
  }
  const tracks = catalog.filter((t) => t.search.includes(q))
    .sort((a, b) => Number(norm(b.title).includes(q)) - Number(norm(a.title).includes(q)));
  const artists = allArtists.filter((a) => norm(a.name).includes(q));
  const albums = allAlbums.filter((a) => a.search.includes(q));
  const playlists = state.playlists.filter((p) => norm(p.name).includes(q));
  const mixes = activeMoods.filter((m) => norm(m.title).includes(q));
  const total = tracks.length + artists.length + albums.length + playlists.length + mixes.length;
  if (!total) {
    const html = pageHead('Search', `No matches for “${raw}”`)
      + emptyState('search', `No results for “${raw}”`, 'Check the spelling, or try a track title, an artist, an album or a playlist name.', `<button class="btn" type="button" data-action="clear-search">${icon('x')}Clear search</button>`);
    return { html, title: 'Search', nav: 'search' };

    + (artists.length ? section('Artists', `<div class="grid">${artists.map(artistCard).join('')}</div>`) : '')

/* ==========================================================================

const ROUTES = { home: viewHome, search: viewSearch, library: viewLibrary, favorites: viewFavorites, playlists: viewPlaylists, albums: viewAlbums, artists: viewArtists, recent: viewRecent, album: viewAlbum, artist: viewArtist, playlist: viewPlaylist, mix: viewMix, profile: viewProfile };
const NAV = [
  { id: 'home', label: 'Home', icon: 'home' },
  { id: 'search', label: 'Search', icon: 'search' },
  { id: 'library', label: 'Your Library', icon: 'library' },
  { id: 'favorites', label: 'Favorite Tracks', icon: 'heart' },
  { id: 'playlists', label: 'My Playlists', icon: 'playlist' },
  { id: 'albums', label: 'Albums', icon: 'disc' },
  { id: 'artists', label: 'Artists', icon: 'mic' },
  { id: 'recent', label: 'Recently Played', icon: 'clock' },
];
const MOBILE_NAV = [
  { id: 'home', label: 'Home', icon: 'home' },
  { id: 'search', label: 'Search', icon: 'search' },
  { id: 'library', label: 'Library', icon: 'library' },
  { id: 'favorites', label: 'Favorites', icon: 'heart' },
  { id: 'profile', label: 'Profile', icon: 'user' },
];
const viewEl = $('#view');

function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [name = '', ...rest] = raw.split('?')[0].split('/');
  let id = rest.join('/');
  try { id = decodeURIComponent(id); } catch (err) { /* keep the raw id */ }
  return { name: name || 'home', id };
}
function render({ keepScroll = false, animate = !keepScroll } = {}) {
  ui.route = parseRoute();

    const fn = ROUTES[ui.route.name];

    out = { html: emptyState('alert', 'Something went wrong', 'This page could not be displayed. Try going back to Home.', `<a class="btn primary" href="#/home">${icon('home')}Back to Home</a>`), title: 'Error', nav: '' };
  }
  if (!out) out = viewNotFound();
  const top = viewEl.scrollTop;
  viewEl.classList.toggle('no-anim', !animate);
  viewEl.innerHTML = `<div class="page">${out.html}</div>`;
  viewEl.scrollTop = keepScroll ? top : 0;
  ui.pageTitle = out.title ? `${out.title} — Sonara` : 'Sonara';
  ui.nav = out.nav;
  setActiveNav(out.nav);
  updateDocTitle();
  markCurrent();
  $('#topbar').classList.toggle('scrolled', viewEl.scrollTop > 8);
}
const refresh = () => render({ keepScroll: true });
const navigate = (hash) => { closeNowPlaying(); if (location.hash === hash) render(); else location.hash = hash; };

function setActiveNav(id) {

/* ==========================================================================
   9. PLAYER (HTML5 Audio)
   ========================================================================== */
const audio = $('#audio');
/* queue: track ids in their original order. order: play order as indexes into queue. pos: index into order. */
const player = { queue: [], order: [], pos: -1, source: '', wantPlay: false, errorStreak: 0, skipTimer: 0, logged: false };

const currentTrack = () => (player.pos >= 0 ? trackById.get(player.queue[player.order[player.pos]]) || null : null);
const isPlaying = () => !audio.paused && !audio.ended;
const audioIsFor = (t) => !!t && audio.dataset.trackId === t.id;

function saveSession() {
  store.set('session', { queue: player.queue, order: player.order, pos: player.pos, source: player.source });
}
function restoreSession() {
  const s = store.get('session', null);
  if (!s || !Array.isArray(s.queue)) return;
  const queue = s.queue.filter((id) => trackById.has(id));
  if (!queue.length) return;
  const n = queue.length;
  const valid = n === s.queue.length && Array.isArray(s.order) && s.order.length === n && new Set(s.order).size === n
    && s.order.every((i) => Number.isInteger(i) && i >= 0 && i < n) && Number.isInteger(s.pos) && s.pos >= 0 && s.pos < n;
  player.queue = queue;
  player.order = valid ? s.order : queue.map((_, i) => i);
  player.pos = valid ? s.pos : 0;
  player.source = typeof s.source === 'string' ? s.source : '';
}
function buildOrder(startIndex) {
  const indexes = player.queue.map((_, i) => i);
  if (state.settings.shuffle) {
    player.order = [startIndex].concat(shuffled(indexes.filter((i) => i !== startIndex)));
    player.pos = 0;
  } else {
    player.order = indexes;
    player.pos = startIndex;
  }
}
function startQueue(ids, startId, source) {
  const queue = ids.filter((id) => trackById.has(id));
  if (!queue.length) { toast('There is nothing to play here yet.', 'info'); return; }
  player.queue = queue;
  player.source = source || '';
  buildOrder(Math.max(0, queue.indexOf(startId)));
  player.errorStreak = 0;
  loadCurrent();
}
function loadAudio(t) {
  audio.dataset.trackId = t.id;
  player.logged = false;
  audio.src = t.audio;
}
/* Loads the track at the current queue position and starts it. */
function loadCurrent() {
  const t = currentTrack();
  if (!t) return;
  clearTimeout(player.skipTimer);
  ui.seeking = null;
  ui.pendingSeek = null;
  loadAudio(t);
  updateTrackUI();
  saveSession();
  play();
}
function play() {
  const t = currentTrack();
  if (!t) return;
  player.wantPlay = true;
  clearTimeout(player.skipTimer);
  if (!audioIsFor(t) || audio.error) loadAudio(t);
  const attempt = audio.play();
  if (attempt && typeof attempt.catch === 'function') {
    attempt.catch((err) => {
      /* Load failures are reported by the "error" event; AbortError just means another track took over. */
      if (err && err.name === 'NotAllowedError') {
        player.wantPlay = false;
        syncPlayState();
        toast('Your browser blocked playback. Press play to start.', 'info');
      }
    });
  }
}
function pause() {
  player.wantPlay = false;
  clearTimeout(player.skipTimer);
  audio.pause();
}
function togglePlay() {
  const t = currentTrack();
  if (!t) { playCollection('all'); return; }
  player.errorStreak = 0;
  if (isPlaying() && audioIsFor(t)) pause(); else play();
}
function next(auto = false) {
  if (!player.queue.length) { if (!auto) togglePlay(); return; }
  if (!auto) player.errorStreak = 0;
  if (player.pos < player.order.length - 1) {
    player.pos++;
  } else if (state.settings.repeat === 'all' || !auto) {
    if (state.settings.shuffle && player.queue.length > 1) {
      const last = player.order[player.pos];
      let order;
      do { order = shuffled(player.order); } while (order[0] === last);
      player.order = order;
    }
    player.pos = 0;
  } else {
    player.wantPlay = false;
    syncPlayState();
    return;
  }
  loadCurrent();
}
function prev() {
  const t = currentTrack();
  if (!t) return;
  player.errorStreak = 0;
  const loaded = audioIsFor(t) && !audio.error;
  if ((loaded && audio.currentTime > 3) || player.pos === 0) {
    if (loaded) { audio.currentTime = 0; play(); } else loadCurrent();
    return;
  }
  player.pos--;
  loadCurrent();
}
function jumpTo(pos) {
  if (pos < 0 || pos >= player.order.length) return;
  player.pos = pos;
  player.errorStreak = 0;
  loadCurrent();
}
function playNext(id) {
  const t = trackById.get(id);
  if (!t) return;
  if (!currentTrack()) { startQueue([id], id, ''); return; }
  player.queue.push(id);
  player.order.splice(player.pos + 1, 0, player.queue.length - 1);
  saveSession();
  renderQueue();
  toast(`“${t.title}” will play next`, 'success');
}
function addToQueue(id) {
  const t = trackById.get(id);
  if (!t) return;
  if (!currentTrack()) { startQueue([id], id, ''); return; }
  player.queue.push(id);
  player.order.push(player.queue.length - 1);
  saveSession();
  renderQueue();
  toast(`Added “${t.title}” to the queue`, 'success');
}
function collectionIds(kind, id) {
  switch (kind) {
    case 'album': return (albumById.get(id) || { tracks: [] }).tracks.map((t) => t.id);
    case 'artist': return (artistById.get(id) || { tracks: [] }).tracks.map((t) => t.id);
    case 'mix': return (moodById.get(id) || { tracks: [] }).tracks.map((t) => t.id);
    case 'playlist': return (playlistById(id) || { trackIds: [] }).trackIds.slice();
    case 'favorites': return state.favorites.slice();
    case 'recent': return recentTracks(60).map((t) => t.id);
    default: return catalog.map((t) => t.id);
  }
}
function playCollection(kind, id = '', { shuffle = false } = {}) {
  const ids = collectionIds(kind, id);
  const source = `${kind}:${id}`;
  if (!ids.length) {
    toast(kind === 'favorites' ? 'You have no favorite tracks yet.' : 'There are no tracks here yet.', 'info');
    return;
  }
  if (!shuffle && player.source === source && currentTrack()) { togglePlay(); return; }
  if (shuffle) setShuffle(true, true);
  startQueue(ids, shuffle ? ids[Math.floor(Math.random() * ids.length)] : ids[0], source);
}
function playFromList(key, id) {
  const list = ui.lists[key];
  if (list) startQueue(list.ids, id, list.source); else startQueue([id], id, '');
}
function activateTrack(id, key) {
  const cur = currentTrack();
  if (cur && cur.id === id) togglePlay(); else playFromList(key, id);
}
function sourceLabel() {
  const [kind, ...rest] = (player.source || '').split(':');
  const id = rest.join(':');
  const named = (prefix, item, field) => (item ? `${prefix} · ${item[field]}` : prefix);
  switch (kind) {
    case 'album': return named('Album', albumById.get(id), 'title');
    case 'artist': return named('Artist', artistById.get(id), 'name');
    case 'mix': return named('Mix', moodById.get(id), 'title');
    case 'playlist': return named('Playlist', playlistById(id), 'name');
    case 'favorites': return 'Favorite Tracks';
    case 'recent': return 'Recently Played';
    case 'search': return 'Search results';
    case 'recommended': return 'Recommended Tracks';
    case 'trending': return 'Trending Music';
    case 'all': return 'All tracks';
    default: return 'Your queue';
  }
}

/* ----- shuffle / repeat / volume / seek ----- */
function setShuffle(on, quiet = false) {
  if (state.settings.shuffle === on) return;
  state.settings.shuffle = on;
  saveSettings();

/* ----- player UI sync ----- */
function updateProgress() {

function setLoading(on) {

/* ----- audio element events ----- */
function onAudioError() {
  const t = currentTrack();
  if (!t || !audioIsFor(t)) return;
  failed.add(t.id);
  setLoading(false);
  syncPlayState();
  markCurrent();
  if (!player.wantPlay) return;
  const offline = navigator.onLine === false;
  player.errorStreak++;
  toast(offline ? `You appear to be offline, so “${t.title}” cannot be loaded.` : `“${t.title}” is unavailable — its audio file could not be loaded.`, 'error');
  if (offline || player.errorStreak >= 3 || player.queue.length < 2) {
    player.wantPlay = false;
    if (player.errorStreak >= 3) toast('Playback stopped after several failed tracks. Check your connection and try again.', 'error');
    player.errorStreak = 0;
    return;
  }
  player.skipTimer = setTimeout(() => next(true), 1500);
}
function bindAudio() {
  audio.addEventListener('play', syncPlayState);
  audio.addEventListener('pause', syncPlayState);
  audio.addEventListener('playing', () => {
    setLoading(false);
    player.errorStreak = 0;
    const t = currentTrack();
    if (t && audioIsFor(t)) {
      if (failed.delete(t.id)) markCurrent();
      if (!player.logged) { player.logged = true; addHistory(t.id); }
    }
    syncPlayState();
  });
  audio.addEventListener('waiting', () => setLoading(true));
  audio.addEventListener('loadstart', () => setLoading(true));
  audio.addEventListener('canplay', () => setLoading(false));
  audio.addEventListener('loadedmetadata', () => {
    const t = currentTrack();
    if (t && audioIsFor(t) && isFinite(audio.duration) && audio.duration > 0 && !t.duration) {
      /* Fill in a duration the catalog did not know. */
      t.duration = Math.round(audio.duration);
      $$(`.row[data-track-id="${cssEsc(t.id)}"] .row-dur`).forEach((el) => { el.textContent = fmtDur(t.duration); });
    }
    if (ui.pendingSeek != null) {
      const target = ui.pendingSeek;
      ui.pendingSeek = null;
      audio.currentTime = clamp(target, 0, audio.duration || target);
    }
    updateProgress();
  });
  audio.addEventListener('durationchange', updateProgress);
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('seeked', updateProgress);
  audio.addEventListener('ended', () => {
    if (state.settings.repeat === 'one') { audio.currentTime = 0; play(); } else next(true);
  });
  audio.addEventListener('error', onAudioError);
}

/* Center-crops an uploaded picture to a small square JPEG so it fits comfortably in localStorage. */
function imageToDataURL(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error('Not an image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode image'));
      img.onload = () => {
        try {
          const size = 360, side = Math.min(img.naturalWidth, img.naturalHeight);
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = size;
          canvas.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
          resolve(canvas.toDataURL('image/jpeg', 0.84));
        } catch (err) { reject(err); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function toast(message, type = 'info') {
  const box = $('#toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="toast-dot">${icon(type === 'error' ? 'alert' : type === 'success' ? 'check' : 'music')}</span><span>${esc(message)}</span>`;
  box.append(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, type === 'error' ? 5200 : 2800);
}

function trapFocus(e) {
  const modal = $('#modal');
  if (!modal) return;
  const items = $$('a[href], button:not([disabled]), input:not([disabled]):not([type="file"]), textarea, [tabindex]:not([tabindex="-1"])', modal).filter((el) => el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (!modal.contains(document.activeElement)) { e.preventDefault(); first.focus(); }

  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

  if (!pl) return;
  const rows = (query) => {
    const q = norm(query);
    const items = catalog.filter((t) => !q || t.search.includes(q));
    if (!items.length) return `<p class="muted" style="padding:14px 8px">No tracks match “${esc(query)}”.</p>`;
    return items.map((t) => {
      const has = pl.trackIds.includes(t.id);
      return `<button class="pick" type="button" data-pick="${esc(t.id)}" aria-pressed="${has}"><img src="${esc(t.cover)}" alt="" loading="lazy"><span class="pick-main"><b>${esc(t.title)}</b><small>${esc(t.artist)} · ${esc(t.album)}</small></span><span class="state">${pickState(has)}</span></button>`;
    }).join('');
  };
  openModal({
    title: `Add tracks to ${pl.name}`,
    wide: true,
    body: `<input class="input" id="add-filter" type="search" placeholder="Filter by title, artist or album" aria-label="Filter tracks" autocomplete="off">
      <div class="pick-list" id="add-list" style="margin-top:12px">${rows('')}</div>
      <div class="modal-actions">
        <span class="muted" id="add-count" style="margin-right:auto;align-self:center"></span>
        <button class="btn primary" type="button" data-action="close-modal">Done</button>
      </div>`,
    onOpen() {
      const filter = $('#add-filter'), listEl = $('#add-list');
      const count = () => { $('#add-count').textContent = plural(pl.trackIds.length, 'track') + ' in playlist'; };
      count();
      filter.addEventListener('input', () => { listEl.innerHTML = rows(filter.value); });
      listEl.addEventListener('click', (e) => {
        const b = e.target.closest('[data-pick]');
        if (!b) return;
        const id = b.dataset.pick, has = pl.trackIds.includes(id);
        if (has) removeFromPlaylist(pl.id, id, { quiet: true }); else addToPlaylist(pl.id, id, { quiet: true });
        b.setAttribute('aria-pressed', String(!has));
        b.querySelector('.state').innerHTML = pickState(!has);
        count();
      });
    },
    onClose: afterPlaylistChange,
  });
}
function openEditName() {
  openModal({
    title: 'Edit username',
    body: `<form id="name-form" novalidate>
        <label class="field"><span>Username</span>
          <input class="input" id="name-input" type="text" maxlength="30" value="${esc(state.profile.name)}" autocomplete="off" required>
          <small class="field-error" id="name-error" role="alert"></small>
        </label>
        <p class="muted" style="font-size:13px">Shown in your greeting and on your playlists. It is saved only in this browser.</p>
        <div class="modal-actions">
          <button class="btn" type="button" data-action="close-modal">Cancel</button>
          <button class="btn primary" type="submit">Save</button>
        </div>

    onOpen() {

}

    ['↑ / ↓', 'Volume up / down'], ['M', 'Mute or unmute'], ['S', 'Toggle shuffle'], ['R', 'Change repeat mode'],

const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (err) { return 'Open source page'; } };
const licenseHtml = (t) => (t.license ? (LICENSE_URL[t.license] ? extLink(LICENSE_URL[t.license], t.license) : esc(t.license)) : 'Not specified');

function openMenu(items, { anchor = null, x = 0, y = 0, head = '' } = {}) {
  closeMenu();
  const menu = $('#context-menu');
  ui.menuItems = items.filter(Boolean);
  menu.innerHTML = head + ui.menuItems.map((it, i) => (it === 'sep'
    ? '<div class="menu-sep" role="separator"></div>'
    : `<button class="menu-item${it.danger ? ' danger' : ''}" type="button" role="menuitem" data-menu-index="${i}">${icon(it.icon)}<span>${esc(it.label)}</span></button>`)).join('');
  menu.hidden = false;
  $('#menu-scrim').hidden = false;
  ui.menuAnchor = anchor;
  const w = menu.offsetWidth, h = menu.offsetHeight;
  let left = x, top = y;
  if (anchor) {
    const r = anchor.getBoundingClientRect();
    left = r.right - w;
    top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = r.top - h - 6;
  }
  menu.style.left = clamp(left, 8, Math.max(8, window.innerWidth - w - 8)) + 'px';
  menu.style.top = clamp(top, 8, Math.max(8, window.innerHeight - h - 8)) + 'px';
  const first = menu.querySelector('.menu-item');
  if (first) first.focus({ preventScroll: true });
}
function closeMenu() {
  const menu = $('#context-menu');
  if (menu.hidden) return false;
  const anchor = ui.menuAnchor;
  menu.hidden = true;
  menu.innerHTML = '';
  $('#menu-scrim').hidden = true;
  ui.menuAnchor = null;
  ui.menuItems = [];
  if (anchor && anchor.isConnected) anchor.focus({ preventScroll: true });
  return true;
}
function openTrackMenu(id, opts = {}) {
  const t = trackById.get(id);
  if (!t) return;
  const pl = opts.playlistId ? playlistById(opts.playlistId) : null;
  const isCurrent = () => { const c = currentTrack(); return !!c && c.id === id; };
  const items = [
    { icon: isCurrent() && isPlaying() ? 'pause' : 'play', label: isCurrent() && isPlaying() ? 'Pause' : 'Play now', run: () => { if (isCurrent()) togglePlay(); else playFromList(opts.listKey, id); } },
    { icon: 'play-next', label: 'Play next', run: () => playNext(id) },
    { icon: 'queue', label: 'Add to queue', run: () => addToQueue(id) },
    'sep',
    { icon: 'heart', label: isFav(id) ? 'Remove from favorites' : 'Add to favorites', run: () => toggleFav(id) },
    { icon: 'plus', label: 'Add to playlist…', run: () => openAddToPlaylist(id) },
    pl ? { icon: 'x', label: 'Remove from this playlist', danger: true, run: () => { removeFromPlaylist(pl.id, id); afterPlaylistChange(); } } : null,
    'sep',
    { icon: 'disc', label: 'Go to album', run: () => navigate('#/album/' + t.albumId) },
    { icon: 'mic', label: 'Go to artist', run: () => navigate('#/artist/' + t.artistId) },
    { icon: 'info', label: 'Track info & license', run: () => openTrackInfo(id) },
  ];
  const head = `<div class="menu-head"><img src="${esc(t.cover)}" alt=""><div style="min-width:0"><b class="truncate" style="display:block">${esc(t.title)}</b><small class="muted">${esc(t.artist)}</small></div></div>`;
  openMenu(items, { anchor: opts.anchor || null, x: opts.x, y: opts.y, head });
}

/* ==========================================================================
   12. EVENTS
   ========================================================================== */
function openNowPlaying() {
  const panel = $('#now-playing');
  if (!panel.hidden) { closeNowPlaying(); return; }
  panel.hidden = false;
  panel.scrollTop = 0;
  renderQueue();
  $('#np-close').focus({ preventScroll: true });
}
function closeNowPlaying() {
  const panel = $('#now-playing');
  if (panel.hidden) return false;
  panel.hidden = true;
  return true;
}
function setDrawer(open) {
  document.body.classList.toggle('drawer-open', open);
  $('#btn-menu').setAttribute('aria-expanded', String(open));
}
const closeDrawer = () => { const was = document.body.classList.contains('drawer-open'); setDrawer(false); return was; };
function setTheme(theme) {
  state.theme = theme;
  store.set('theme', theme);
  applyTheme();
  if (ui.route.name === 'profile' && !ui.modal) refresh();
}

function handleAction(action, el, event) {
  const d = el.dataset;
  switch (action) {
    /* playback */
    case 'toggle-play': togglePlay(); break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'shuffle': setShuffle(!state.settings.shuffle); break;
    case 'repeat': cycleRepeat(); break;
    case 'mute': toggleMute(); break;
    case 'play-track': activateTrack(d.id, d.list); break;
    case 'play-collection': playCollection(d.kind, d.id || '', { shuffle: d.shuffle === '1' }); break;
    case 'queue-jump': jumpTo(Number(d.pos)); break;
    case 'open-now-playing': openNowPlaying(); break;
    case 'close-now-playing': closeNowPlaying(); break;
    /* favorites and menus */
    case 'fav': toggleFav(d.favId, el); break;
    case 'fav-current': { const t = currentTrack(); if (t) toggleFav(t.id, el); break; }
    case 'more': openTrackMenu(d.id, { anchor: el, playlistId: d.playlist, listKey: (el.closest('[data-list]') || { dataset: {} }).dataset.list }); break;
    case 'more-current': { const t = currentTrack(); if (t) openTrackMenu(t.id, { anchor: el }); break; }
    /* playlists */
    case 'new-playlist': closeDrawer(); openPlaylistForm(); break;
    case 'edit-playlist': { const pl = playlistById(d.id); if (pl) openPlaylistForm(pl); break; }
    case 'add-tracks': openAddTracks(d.id); break;
    case 'delete-playlist': {
      const pl = playlistById(d.id);
      if (pl) openConfirm({ title: 'Delete playlist?', message: `“${pl.name}” and its list of ${plural(pl.trackIds.length, 'track')} will be removed from this browser. This cannot be undone.`, confirmLabel: 'Delete playlist', danger: true, onConfirm: () => deletePlaylist(pl.id) });
      break;
    }
    case 'remove-from-playlist': if (removeFromPlaylist(d.playlist, d.id)) afterPlaylistChange(); break;
    case 'quick-add': if (addToPlaylist(d.playlist, d.id)) afterPlaylistChange(); break;
    /* app chrome */
    case 'toggle-theme': setTheme(state.theme === 'dark' ? 'light' : 'dark'); break;
    case 'toggle-drawer': setDrawer(!document.body.classList.contains('drawer-open')); break;
    case 'close-drawer': closeDrawer(); break;
    case 'close-modal': closeModal(); break;
    case 'open-shortcuts': openShortcuts(); break;
    case 'open-credits': closeDrawer(); openCredits(); break;
    case 'history-back': history.back(); break;
    case 'history-forward': history.forward(); break;
    case 'rail-scroll': {
      const rail = el.closest('.section') && el.closest('.section').querySelector('.rail');
      if (rail) rail.scrollBy({ left: Number(d.dir) * rail.clientWidth * 0.85, behavior: 'smooth' });
      break;
    }
    case 'refresh-reco': pickRecommendations(); refresh(); toast('Here are some new recommendations', 'info'); break;
    case 'clear-search': {
      const input = $('#search-input');
      input.value = '';
      ui.query = '';
      $('#search-clear').hidden = true;
      if (ui.route.name === 'search') render({ animate: false });
      input.focus();
      break;
    }
    /* profile and data */
    case 'edit-name': openEditName(); break;
    case 'set-avatar-color': state.profile.hue = Number(d.hue); saveProfile(); renderProfileChip(); refresh(); break;
    case 'clear-history':
      openConfirm({ title: 'Clear listening history?', message: 'Your recently played list will be emptied. Favorites and playlists are not affected.', confirmLabel: 'Clear history', danger: true, onConfirm: () => { state.history = []; saveHistory(); refresh(); toast('Listening history cleared', 'info'); } });
      break;
    case 'reset-data':
      openConfirm({ title: 'Reset all saved data?', message: 'This removes your username, favorites, playlists, history and settings from this browser and reloads the app.', confirmLabel: 'Reset everything', danger: true, onConfirm: () => { store.clear(); location.reload(); } });
      break;
    default: break;
  }
  if (event && el.tagName === 'A') event.preventDefault();
}

function onDocumentClick(e) {
  const menu = $('#context-menu');
  if (!menu.hidden) {
    const item = e.target.closest('[data-menu-index]');
    if (item) {
      const entry = ui.menuItems[Number(item.dataset.menuIndex)];
      closeMenu();
      if (entry && entry.run) entry.run();
      return;
    }
    if (!e.target.closest('#context-menu')) {
      const anchor = ui.menuAnchor;
      closeMenu();
      if (anchor && anchor.contains(e.target)) return;
    }
  }
  const el = e.target.closest('[data-action]');
  if (el) {
    if (el.disabled) return;
    handleAction(el.dataset.action, el, e);
    return;
  }
  if (e.target.closest('#sidebar a')) closeDrawer();
  if (e.target.closest('#now-playing a')) closeNowPlaying();
  const row = e.target.closest('.row[data-track-id]');
  if (row && !e.target.closest('a, button, input')) activateTrack(row.dataset.trackId, row.dataset.list);
}
function onContextMenu(e) {
  const host = e.target.closest('[data-track-id]');
  if (!host || e.target.closest('input, textarea')) return;
  e.preventDefault();
  openTrackMenu(host.dataset.trackId, { x: e.clientX, y: e.clientY, playlistId: host.dataset.playlist, listKey: host.dataset.list || (host.querySelector('[data-list]') || { dataset: {} }).dataset.list });
}
function onKeyDown(e) {
  const menu = $('#context-menu');
  if (e.key === 'Escape') {
    if (closeMenu() || closeModal() || closeNowPlaying() || closeDrawer()) e.preventDefault();
    else if (document.activeElement === $('#search-input')) $('#search-input').blur();
    return;
  }
  if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const items = $$('.menu-item', menu), i = items.indexOf(document.activeElement);
    const nextItem = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
    if (nextItem) nextItem.focus();
    e.preventDefault();
    return;
  }
  if (ui.modal) { if (e.key === 'Tab') trapFocus(e); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const target = e.target;
  const onSeekSlider = target.matches && target.matches('[data-role="seek"]');
  if (target.closest && target.closest('input, textarea, select, [contenteditable="true"]') && !(onSeekSlider && (e.key === 'ArrowLeft' || e.key === 'ArrowRight'))) return;
  const onControl = target.closest && target.closest('button, a, [role="menuitem"]');
  /* Letter shortcuts fall back to the physical key so they also work on non-Latin keyboard layouts. */
  let key = e.key;
  if (/^[a-z]$/i.test(key)) key = key.toLowerCase();
  else if (/^Key[A-Z]$/.test(e.code || '')) key = e.code.slice(3).toLowerCase();
  else if (e.code === 'Slash' && key !== '/' && key !== '?') key = e.shiftKey ? '?' : '/';
  switch (key) {
    case ' ': if (onControl) return; togglePlay(); break;
    case 'k': togglePlay(); break;
    case 'ArrowRight': if (e.shiftKey) next(); else seekBy(5); break;
    case 'ArrowLeft': if (e.shiftKey) prev(); else seekBy(-5); break;
    case 'ArrowUp': setVolume((state.settings.muted ? 0 : state.settings.volume) + 0.05); break;
    case 'ArrowDown': setVolume((state.settings.muted ? 0 : state.settings.volume) - 0.05); break;
    case 'n': next(); break;
    case 'p': prev(); break;
    case 'm': toggleMute(); break;
    case 's': setShuffle(!state.settings.shuffle); break;
    case 'r': cycleRepeat(); break;
    case 'l': { const t = currentTrack(); if (t) toggleFav(t.id, $('#player-fav')); else toast('Play a track first, then press L to save it.', 'info'); break; }
    case 'q': openNowPlaying(); break;
    /* Search is focused on key-up, so the "/" keystroke itself is never typed into the box. */
    case '/': ui.slashDown = true; break;
    case '?': openShortcuts(); break;
    default: return;
  }
  e.preventDefault();
}
function bindEvents() {
  document.addEventListener('click', onDocumentClick);
  document.addEventListener('contextmenu', onContextMenu);
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', () => {
    if (!ui.slashDown) return;
    ui.slashDown = false;
    if (ui.route.name !== 'search') location.hash = '#/search';
    $('#search-input').focus();
  });

  /* Seek and volume sliders (there is one set in the bar and one in the now-playing view). */
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.matches) return;
    if (el.matches('[data-role="seek"]')) { ui.seeking = Number(el.value) / 1000; updateProgress(); }
    else if (el.matches('[data-role="volume"]')) setVolume(Number(el.value) / 100);
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (!el.matches || !el.matches('[data-role="seek"]')) return;
    const fraction = Number(el.value) / 1000;
    ui.seeking = null;
    seekTo(fraction * trackDuration());
  });
  document.addEventListener('focusout', (e) => {
    if (e.target.matches && e.target.matches('[data-role="seek"]') && ui.seeking != null) { ui.seeking = null; updateProgress(); }
  });

  /* Search */
  const input = $('#search-input');
  input.addEventListener('input', () => {
    ui.query = input.value;
    $('#search-clear').hidden = !input.value;
    if (ui.route.name === 'search') render({ animate: false }); else location.hash = '#/search';
  });
  input.addEventListener('click', () => { if (ui.route.name !== 'search') location.hash = '#/search'; });
  $('#search-form').addEventListener('submit', (e) => e.preventDefault());

  /* Routing */
  window.addEventListener('hashchange', () => {
    closeMenu();
    closeModal(true);
    closeNowPlaying();
    closeDrawer();
    render();
    if (ui.route.name === 'search' && window.matchMedia('(hover: hover) and (pointer: fine)').matches) input.focus({ preventScroll: true });
  });

  viewEl.addEventListener('scroll', () => {
    $('#topbar').classList.toggle('scrolled', viewEl.scrollTop > 8);
    closeMenu();
  }, { passive: true });
  window.addEventListener('resize', () => { closeMenu(); if (window.innerWidth > 900) closeDrawer(); });
  window.addEventListener('offline', () => toast('You are offline. Music cannot be streamed until you reconnect.', 'error'));
  window.addEventListener('online', () => toast('Back online', 'success'));

  /* Any image that fails to load falls back to a generated placeholder. */
  document.addEventListener('error', (e) => {
    const img = e.target;
    if (img && img.tagName === 'IMG' && !img.dataset.fallback) {
      img.dataset.fallback = '1';
      img.src = FALLBACK_ART;
    }
  }, true);
}

function buildChrome() {
  const transport = `
    <button class="icon-btn" type="button" data-action="shuffle" data-role="shuffle" aria-pressed="false" aria-label="Turn shuffle on" title="Shuffle (S)">${icon('shuffle')}</button>
    <button class="icon-btn" type="button" data-action="prev" aria-label="Previous track" title="Previous (P)">${icon('prev')}</button>
    <button class="play-btn" type="button" data-action="toggle-play" data-role="play" aria-label="Play" title="Play / pause (Space)">${playIcons}</button>
    <button class="icon-btn" type="button" data-action="next" aria-label="Next track" title="Next (N)">${icon('next')}</button>
    <button class="icon-btn" type="button" data-action="repeat" data-role="repeat" data-repeat="off" aria-label="Repeat: off" title="Repeat (R)">${icon('repeat')}<span class="repeat-one" aria-hidden="true">1</span></button>`;
  const progress = `<span class="time" data-role="time-cur">0:00</span>
    <input class="slider" type="range" min="0" max="1000" step="1" value="0" data-role="seek" aria-label="Seek" disabled>
    <span class="time" data-role="time-dur">0:00</span>`;
  const volume = `<button class="icon-btn" type="button" data-action="mute" data-role="mute" aria-pressed="false" aria-label="Mute" title="Mute (M)"></button>
    <input class="slider" type="range" min="0" max="100" step="1" value="80" data-role="volume" aria-label="Volume">`;
  $('#player-transport').innerHTML = transport;
  $('#np-transport').innerHTML = transport;
  $('#player-progress').innerHTML = progress;
  $('#np-progress').innerHTML = progress;
  $('#player-volume').innerHTML = volume;
  $('#np-volume').innerHTML = volume;

  const fill = { '#btn-menu': 'menu', '#btn-back': 'chevron-left', '#btn-forward': 'chevron-right', '#search-clear': 'x', '#btn-shortcuts': 'keyboard', '#btn-side-new-playlist': 'plus', '#player-fav': 'heart', '#np-fav': 'heart', '#btn-queue': 'queue', '#np-close': 'chevron-down', '#np-more': 'more' };
  Object.entries(fill).forEach(([sel, name]) => { $(sel).innerHTML = icon(name); });
  $('#search-icon').outerHTML = icon('search');
  $('#btn-credits').innerHTML = icon('info') + '<span>Credits &amp; licenses</span>';
}
function init() {
  buildChrome();
  applyTheme();
  ui.route = parseRoute();
  renderSidebar();
  renderProfileChip();
  restoreSession();
  applyVolume();
  updateModeUI();
  updateTrackUI();
  syncPlayState();
  bindAudio();
  bindEvents();
  initMediaSession();
  if (!location.hash) {
    try { history.replaceState(null, '', '#/home'); } catch (err) { /* some browsers restrict replaceState on file:// */ }
  }
  render();
}
init();
})();
